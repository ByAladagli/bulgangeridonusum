<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%" class="mardin-svg-map">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1f14" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#142c1c" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="mardinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#15803d" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Region Surface -->
  <rect width="600" height="380" rx="14" fill="#0c131c" stroke="#1f2937" stroke-width="1.5"/>

  <!-- Surrounding Southeastern Provinces (Stylized Region Outlines) -->
  <!-- Gaziantep & Kilis -->
  <path d="M 40 220 L 90 200 L 130 220 L 120 280 L 50 270 Z" fill="#16231d" stroke="#23382c" stroke-width="1.5"/>
  <text x="85" y="245" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Gaziantep</text>

  <!-- Şanlıurfa -->
  <path d="M 130 210 L 230 180 L 270 230 L 240 290 L 125 285 Z" fill="#1a2d23" stroke="#2c4738" stroke-width="1.5"/>
  <text x="195" y="240" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Şanlıurfa</text>

  <!-- Diyarbakır -->
  <path d="M 210 110 L 320 90 L 350 160 L 240 180 Z" fill="#1b3325" stroke="#2c523a" stroke-width="1.5"/>
  <text x="275" y="140" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Diyarbakır</text>

  <!-- Batman -->
  <path d="M 350 120 L 400 110 L 415 170 L 350 175 Z" fill="#1b3024" stroke="#2c4738" stroke-width="1.5"/>
  <text x="380" y="145" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Batman</text>

  <!-- Siirt -->
  <path d="M 415 120 L 480 110 L 490 170 L 420 175 Z" fill="#16231d" stroke="#23382c" stroke-width="1.5"/>
  <text x="450" y="145" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Siirt</text>

  <!-- Şırnak -->
  <path d="M 440 210 L 550 200 L 560 270 L 450 275 Z" fill="#16281e" stroke="#274232" stroke-width="1.5"/>
  <text x="495" y="240" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Şırnak</text>

  <!-- MARDİN PROVINCE (FEATURED HERO SHAPE) -->
  <g filter="url(#glow)">
    <path d="M 260 220 L 310 190 L 370 195 L 430 185 L 450 220 L 430 265 L 360 275 L 290 260 Z"
          fill="url(#mardinGrad)" stroke="#4ade80" stroke-width="2.5" />
  </g>

  <!-- Mardin Internal District Accent Lines -->
  <!-- Kızıltepe -->
  <circle cx="330" cy="245" r="5" fill="#facc15" stroke="#ffffff" stroke-width="1.5"/>
  <text x="330" y="265" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Kızıltepe</text>

  <!-- Artuklu / Mardin Merkez -->
  <circle cx="348" cy="225" r="4" fill="#ffffff"/>
  <text x="350" y="215" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Artuklu</text>

  <!-- Midyat -->
  <circle cx="395" cy="225" r="3.5" fill="#e2e8f0"/>
  <text x="400" y="215" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Midyat</text>

  <!-- Nusaybin -->
  <circle cx="400" cy="255" r="3.5" fill="#e2e8f0"/>
  <text x="405" y="272" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Nusaybin</text>

  <!-- Derik -->
  <circle cx="285" cy="235" r="3.5" fill="#e2e8f0"/>
  <text x="285" y="222" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Derik</text>

  <!-- Central Highlight Badge -->
  <g transform="translate(300, 315)">
    <rect x="-80" y="-14" width="160" height="28" rx="14" fill="#15803d" stroke="#4ade80" stroke-width="1.5"/>
    <text x="0" y="5" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">📍 MARDİN MERKEZ</text>
  </g>

  <!-- Route / Logistic Vectors connecting to surrounding provinces -->
  <path d="M 330 245 Q 260 230 195 240" fill="none" stroke="#22c55e" stroke-dasharray="4,4" stroke-width="1.5" opacity="0.6"/>
  <path d="M 330 245 Q 310 180 275 140" fill="none" stroke="#22c55e" stroke-dasharray="4,4" stroke-width="1.5" opacity="0.6"/>
  <path d="M 350 225 Q 370 180 380 145" fill="none" stroke="#22c55e" stroke-dasharray="4,4" stroke-width="1.5" opacity="0.6"/>
  <path d="M 400 255 Q 450 250 495 240" fill="none" stroke="#22c55e" stroke-dasharray="4,4" stroke-width="1.5" opacity="0.6"/>
</svg>