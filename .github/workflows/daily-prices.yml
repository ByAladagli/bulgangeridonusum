name: Günlük Borsa Hurda Fiyat Kazıyıcı (%20 İndirimli)

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Repo Klonla
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Borsa Hurda Fiyatlarını Çek, %20 Azaltma Uygula ve Rapor Gönder
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python scraper_daily_prices.py --notify-email

      - name: Güncel Fiyatları Kaydet
        run: |
          git config user.name "Bulgan Hurdacılık Bot"
          git config user.email "bulganorhan19@gmail.com"
          git add data/prices.json
          git diff --staged --quiet || (git commit -m "chore(prices): günlük borsa hurda fiyatları güncellendi (-%20)" && git push)
